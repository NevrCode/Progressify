appId: com.nevrcode.progressify
name: Request and complete password reset
tags:
  - critical
  - destructive
env:
  E2E_RESET_EMAIL: ${E2E_RESET_EMAIL}
  E2E_RESET_TOKEN: ${E2E_RESET_TOKEN}
  E2E_NEW_PASSWORD: ${E2E_NEW_PASSWORD}
---
- launchApp:
    clearState: true
- tapOn: "Forgot Password?"
- assertVisible: "Reset password"
- tapOn: "Email address"
- inputText: ${E2E_RESET_EMAIL}
- tapOn: "Send reset link"
- assertVisible: "If an account exists for that email, reset instructions have been sent."
- openLink: "progressify://reset-password?token=${E2E_RESET_TOKEN}"
- assertVisible: "Choose a new password"
- tapOn: "New password"
- inputText: ${E2E_NEW_PASSWORD}
- tapOn: "Confirm new password"
- inputText: ${E2E_NEW_PASSWORD}
- tapOn: "Change password"
- tapOn: "Continue"
- assertVisible: "Welcome Back"
