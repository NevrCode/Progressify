appId: com.nevrcode.progressify
name: Critical workout and nutrition navigation
tags:
  - critical
env:
  E2E_EMAIL: ${E2E_EMAIL}
  E2E_PASSWORD: ${E2E_PASSWORD}
---
- runFlow: login.yaml
- tapOn: "Workout"
- assertVisible: "Start a Workout"
- tapOn: "Food"
- assertVisible: "Food Diary"
- assertVisible: "Log Food Now"
